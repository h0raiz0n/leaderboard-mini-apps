<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Poker Leaderboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #0d0f17;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-base {
      background: linear-gradient(180deg, rgba(25, 33, 52, 0.8) 0%, rgba(18, 23, 37, 0.9) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .top-1 {
      border: 1px solid rgba(234, 179, 8, 0.5);
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.18) 0%, rgba(20, 26, 43, 0.95) 100%);
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.15);
    }
    .top-2 {
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: linear-gradient(135deg, rgba(148, 163, 184, 0.15) 0%, rgba(20, 26, 43, 0.95) 100%);
    }
    .top-3 {
      border: 1px solid rgba(217, 119, 6, 0.4);
      background: linear-gradient(135deg, rgba(217, 119, 6, 0.15) 0%, rgba(20, 26, 43, 0.95) 100%);
    }
    .tab-active {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.4);
    }
  </style>
</head>
<body class="p-4 max-w-md mx-auto pb-10">

  <!-- Header -->
  <div class="flex justify-between items-center mb-5">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-xl">
        ♠️
      </div>
      <div>
        <h1 class="text-xl font-black text-white tracking-wide uppercase">АТМОСФЕРА</h1>
        <p class="text-[11px] text-indigo-400 font-semibold tracking-wider uppercase">Покерный лидерборд</p>
      </div>
    </div>
    <span id="updated-at" class="text-[10px] text-slate-500 bg-white/5 px-2 py-1 rounded-full font-mono">--:--</span>
  </div>

  <!-- Search -->
  <div class="mb-4">
    <input type="text" id="search-input" placeholder="🔍 Найти игрока..." 
           class="w-full p-3.5 rounded-2xl card-base text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500/50 transition">
  </div>

  <!-- Leaderboard List -->
  <div id="leaderboard-list" class="space-y-2.5">
    <div class="text-center py-12 text-slate-500 text-sm animate-pulse">Загрузка данных...</div>
  </div>

  <!-- Modal -->
  <div id="player-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-end justify-center hidden z-50">
    <div class="card-base w-full rounded-t-3xl p-6 max-h-[88vh] overflow-y-auto relative animate-in slide-in-from-bottom duration-200">
      <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-slate-400 hover:text-white">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    // 🔗 ВСТАВЬ СВОЙ URL ИЗ GOOGLE APPS SCRIPT СЮДА:
    const API_URL = "https://script.google.com/macros/s/AKfycbx19vXh8P3TQmD2V55rJhz7YvVOjA2pYZQn1MnsSZoZAFviw-wFL7j4MNKVTmHWrxeSmw/exec"; 

    let allPlayers = [];
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    async function fetchLeaderboard() {
      try {
        const res = await fetch(`${API_URL}?action=leaderboard`);
        const data = await res.json();
        allPlayers = data.players || [];
        renderLeaderboard(allPlayers);
        if (data.updated_at) {
  const d = new Date(data.updated_at);
  document.getElementById('updated-at').innerText = d.toLocaleString('ru-RU', {
    day: '2-digit',
    month: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });
}
      } catch (err) {
        document.getElementById('leaderboard-list').innerHTML = `<div class="text-center py-8 text-red-400 text-sm">Ошибка сети</div>`;
      }
    }

    function renderLeaderboard(players) {
      const container = document.getElementById('leaderboard-list');
      if (!players.length) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Игроки не найдены</div>`;
        return;
      }

      // Чистый компактный вид без ачивок на главной
      container.innerHTML = players.map(p => {
        let cardStyle = "card-base";
        let rankBadge = `<span class="text-slate-500 font-bold text-sm w-6">#${p.rank}</span>`;
        
        if (p.rank === 1) { cardStyle = "top-1"; rankBadge = `<span class="text-xl w-6">🥇</span>`; }
        else if (p.rank === 2) { cardStyle = "top-2"; rankBadge = `<span class="text-xl w-6">🥈</span>`; }
        else if (p.rank === 3) { cardStyle = "top-3"; rankBadge = `<span class="text-xl w-6">🥉</span>`; }

        const isUp = String(p.trend).includes('▲');
        const isDown = String(p.trend).includes('▼');
        const trendColor = isUp ? 'text-emerald-400' : isDown ? 'text-rose-400' : 'text-slate-500';

        return `
          <div onclick="openPlayerProfile('${p.rank}')" 
               class="${cardStyle} p-3.5 rounded-2xl flex items-center justify-between active:scale-[0.98] transition cursor-pointer">
            <div class="flex items-center gap-3">
              ${rankBadge}
              <div>
                <div class="font-bold text-sm text-white flex items-center gap-1.5">
                  <span>${p.display_name}</span>
                  <span class="text-xs">${p.medals}</span>
                </div>
                <div class="text-[11px] text-slate-400 flex items-center gap-1.5 mt-0.5">
                  <span class="bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-1.5 py-0.5 rounded text-[10px] font-semibold">${p.rank_name}</span>
                  <span>•</span>
                  <span>${p.itm_total} ITM</span>
                </div>
              </div>
            </div>
            <div class="text-right">
              <div class="font-black text-lg text-indigo-400">${p.total_score} <span class="text-[10px] text-slate-500 font-normal">PTS</span></div>
              <div class="text-[10px] ${trendColor} font-semibold mt-0.5">${p.trend}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderLeaderboard(allPlayers.filter(p => p.display_name.toLowerCase().includes(q)));
    });

    async function openPlayerProfile(rank) {
      const p = allPlayers.find(x => x.rank == rank);
      if (!p) return;

      const modal = document.getElementById('player-modal');
      const content = document.getElementById('modal-content');
      modal.classList.remove('hidden');

      content.innerHTML = `
        <div class="text-center mb-4">
          <h2 class="text-2xl font-black text-white flex items-center justify-center gap-2">
            <span>${p.display_name}</span>
            <span>${p.medals}</span>
          </h2>
          <p class="text-xs text-indigo-400 font-bold mt-1 tracking-wide uppercase">${p.rank_name} • #${p.rank} Место в сезоне</p>
        </div>

        <!-- Переключатель видов -->
        <div class="flex bg-black/40 p-1 rounded-2xl mb-4 border border-white/5">
          <button id="tab-season" onclick="switchTab('season')" class="flex-1 py-2 text-xs font-bold rounded-xl transition tab-active">
            ⚡ Текущий Сезон
          </button>
          <button id="tab-alltime" onclick="switchTab('alltime')" class="flex-1 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white">
            🏛️ All-Time
          </button>
        </div>

        <!-- Контент Сезона -->
        <div id="view-season" class="space-y-3">
          ${p.achievements ? `
            <div class="bg-gradient-to-r from-indigo-900/40 to-purple-900/40 p-3 rounded-2xl border border-indigo-500/30 text-center shadow-lg">
              <div class="text-[10px] uppercase font-bold text-indigo-300 tracking-wider mb-1">Витрина Достижений</div>
              <div class="text-xl tracking-widest">${p.achievements}</div>
            </div>
          ` : ''}

          <div class="bg-white/5 p-3.5 rounded-2xl border border-white/5">
            <div class="text-xs text-slate-400 mb-2 font-semibold">Разбивка очков (${p.total_score} PTS)</div>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="bg-black/30 p-2.5 rounded-xl border border-white/5">🏆 Победы: <b class="text-white">${p.win_pts}</b></div>
              <div class="bg-black/30 p-2.5 rounded-xl border border-white/5">🎖 Достижения: <b class="text-white">${p.achieve_pts}</b></div>
              <div class="bg-black/30 p-2.5 rounded-xl border border-white/5">⭐ Ранг: <b class="text-white">${p.rank_pts}</b></div>
              <div class="bg-black/30 p-2.5 rounded-xl border border-white/5">🎰 MTT: <b class="text-white">${p.mtt_pts}</b></div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-2xl">
              <div class="text-[10px] text-amber-300 font-bold">🥇 1 места</div>
              <div class="text-lg font-black text-amber-400 mt-0.5">${p.p1}</div>
            </div>
            <div class="bg-slate-400/10 border border-slate-400/20 p-2.5 rounded-2xl">
              <div class="text-[10px] text-slate-300 font-bold">🥈 2 места</div>
              <div class="text-lg font-black text-slate-300 mt-0.5">${p.p2}</div>
            </div>
            <div class="bg-amber-700/10 border border-amber-700/20 p-2.5 rounded-2xl">
              <div class="text-[10px] text-amber-600 font-bold">🥉 3 места</div>
              <div class="text-lg font-black text-amber-600 mt-0.5">${p.p3}</div>
            </div>
          </div>

          <div class="space-y-2 text-xs">
            <div class="bg-white/5 p-3 rounded-2xl border border-white/5 flex justify-between items-center">
              <span class="text-slate-400 font-medium">💎 ITM STACK (Прогресс):</span>
              <span class="font-bold text-blue-400">${p.diamond_prog || '—'}</span>
            </div>
            <div class="bg-white/5 p-3 rounded-2xl border border-white/5 flex justify-between items-center">
              <span class="text-slate-400 font-medium">♠️ FULL SET (Прогресс):</span>
              <span class="font-bold text-purple-400">${p.spade_prog || '—'}</span>
            </div>
          </div>
        </div>

        <!-- Контент All-Time -->
        <div id="view-alltime" class="hidden space-y-3">
          <div id="alltime-loader" class="text-center py-6 text-slate-500 text-xs animate-pulse">
            Загрузка вечной статистики...
          </div>
          <div id="alltime-content" class="hidden space-y-3"></div>
        </div>

        <!-- История игр -->
        <div id="history-container" class="mt-4"></div>
      `;

      try {
        const res = await fetch(`${API_URL}?action=player&name=${encodeURIComponent(p.raw_name)}`);
        const data = await res.json();
        renderAllTimeStats(data);
        renderHistory(data.recent_games);
      } catch (e) {
        document.getElementById('alltime-loader').innerHTML = `<span class="text-red-400">Ошибка загрузки All-Time</span>`;
      }
    }

    function switchTab(tab) {
      const seasonView = document.getElementById('view-season');
      const alltimeView = document.getElementById('view-alltime');
      const btnSeason = document.getElementById('tab-season');
      const btnAlltime = document.getElementById('tab-alltime');

      if (tab === 'season') {
        seasonView.classList.remove('hidden');
        alltimeView.classList.add('hidden');
        btnSeason.className = "flex-1 py-2 text-xs font-bold rounded-xl transition tab-active";
        btnAlltime.className = "flex-1 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white";
      } else {
        seasonView.classList.add('hidden');
        alltimeView.classList.remove('hidden');
        btnAlltime.className = "flex-1 py-2 text-xs font-bold rounded-xl transition tab-active";
        btnSeason.className = "flex-1 py-2 text-xs font-bold rounded-xl transition text-slate-400 hover:text-white";
      }
    }

    function renderAllTimeStats(data) {
  const loader = document.getElementById('alltime-loader');
  const container = document.getElementById('alltime-content');
  if (!loader || !container) return;

  loader.classList.add('hidden');
  container.classList.remove('hidden');

  const st = data.all_time || { 
    total_games: 0, 
    games_top_pct: 100, 
    p1: 0, p2: 0, p3: 0, 
    winrate: "0%", 
    winrate_status: "—" 
  };
  
  container.innerHTML = `
    <div class="grid grid-cols-2 gap-2 text-center">
      <div class="bg-white/5 p-3 rounded-2xl border border-white/5">
        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Всего Призовых Мест</div>
        <div class="text-2xl font-black text-white">${st.total_games}</div>
        <div class="text-[9px] text-indigo-400 font-semibold mt-1">входит в топ ${st.games_top_pct}% игроков</div>
      </div>
      <div class="bg-white/5 p-3 rounded-2xl border border-white/5">
        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Доля первых мест</div>
        <div class="text-2xl font-black text-emerald-400">${st.winrate}</div>
        <div class="text-[9px] text-emerald-400/80 font-semibold mt-1">${st.winrate_status}</div>
      </div>
    </div>

    <div class="text-xs font-semibold text-slate-400 mt-2 mb-1">Призовые места за всё время (ITM)</div>
    <div class="grid grid-cols-3 gap-2 text-center text-xs">
      <div class="bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-2xl">
        <div class="text-[10px] text-amber-300 font-bold">🥇 1st</div>
        <div class="text-lg font-black text-amber-400 mt-0.5">${st.p1}</div>
      </div>
      <div class="bg-slate-400/10 border border-slate-400/20 p-2.5 rounded-2xl">
        <div class="text-[10px] text-slate-300 font-bold">🥈 2nd</div>
        <div class="text-lg font-black text-slate-300 mt-0.5">${st.p2}</div>
      </div>
      <div class="bg-amber-700/10 border border-amber-700/20 p-2.5 rounded-2xl">
        <div class="text-[10px] text-amber-600 font-bold">🥉 3rd</div>
        <div class="text-lg font-black text-amber-600 mt-0.5">${st.p3}</div>
      </div>
    </div>
  `;
}

    function renderHistory(games) {
      const hist = document.getElementById('history-container');
      if (!hist) return;

      if (games && games.length) {
        hist.innerHTML = `
          <div class="text-xs font-semibold text-slate-400 mb-2">История игр (${games.length})</div>
          <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
            ${games.map(g => `
              <div class="flex justify-between items-center text-xs p-2.5 rounded-xl bg-white/5 border border-white/5">
                <span class="text-slate-300"><b class="text-white">${g.type}</b> (${g.date}) • <span class="text-slate-400">${g.dealer}</span></span>
                <span class="font-bold ${g.place === 1 ? 'text-amber-400' : 'text-slate-400'}">#${g.place} место</span>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        hist.innerHTML = `<div class="text-xs text-slate-500 text-center py-2">Нет записанных игр</div>`;
      }
    }

    function closeModal() { document.getElementById('player-modal').classList.add('hidden'); }
    fetchLeaderboard();
  </script>
</body>
</html>
