  html { height: 100%; }

  body {

  /* ---------- Search ---------- */
  .search {

        <circle cx="24" cy="24" r="23" fill="#e8b84b"/>
        <circle cx="24" cy="24" r="21" fill="none" stroke="#8a6413" stroke-width="1.6"/>
        <circle cx="24" cy="24" r="18" fill="none" stroke="#8a6413" stroke-width="3.4" stroke-dasharray="2.6 2.9"/>
        <circle cx="24" cy="24" r="13.5" fill="none" stroke="#8a6413" stroke-width="2.2"/>
        <circle cx="24" cy="19" r="9" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.6"/>
        <path d="M24 14.2 C19.6 18.7 16.8 21.5 16.8 24.6 a4.9 4.9 0 0 0 7.2 4.4 l-1.5 2.8 h3 l-1.5 -2.8 a4.9 4.9 0 0 0 7.2 -4.4 C31.2 21.5 28.4 18.7 24 14.2 Z" fill="#8a6413"/>
      </svg>
      <div>
        <div class="brand__name">Атмосфера</div>
        <div class="brand__sub">Антикафе · лидерборд</div>
      </div>
    </div>
  </header>

  <main id="view">
    <!-- Рейтинг -->
    <section class="panel active" id="panel-lb">
      <div class="seg" role="tablist" aria-label="Период рейтинга">
        <button class="on" data-per="current" role="tab" aria-selected="true">Месяц</button>
        <button data-per="all" role="tab" aria-selected="false">Всё время</button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="lb-search" type="search" placeholder="Найти игрока…" autocomplete="off" aria-label="Поиск игрока">
      </div>
      <div class="section-head">
        <h2 id="lb-title">Лидерборд</h2>
        <p id="lb-sub">Месяц · по очкам с ачивками</p>
      </div>
      <div id="lb-list" class="lb"></div>
      <div id="lb-state"></div>
    </section>

    <!-- Карточка игрока -->
    <section class="panel" id="panel-player">
      <button class="back" onclick="goBackToLb()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        К рейтингу
      </button>
      <div id="pl-content"></div>
    </section>

    <!-- Подиум -->
    <section class="panel" id="panel-hof">
      <div class="section-head">
        <h2>Подиум</h2>
        <p>Призовые места в MTT · свежие сверху</p>
      </div>
      <div id="hof-list"></div>
      <div id="hof-state"></div>
    </section>

    <!-- Ведущие -->
    <section class="panel" id="panel-dealers">
      <div class="section-head">
        <h2>Ведущие</h2>
        <p id="de-sub">Игры ведущих</p>
      </div>
      <div id="de-content"></div>
      <div id="de-state"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Разделы">
    <div class="tabbar-inner">
      <button class="tab on" data-tab="lb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3c-4.5 5-7.5 8-7.5 11a4 4 0 0 0 6.5 3V21h2v-4a4 4 0 0 0 6.5-3C19.5 11 16.5 8 12 3z"/></svg>
        Рейтинг
      </button>
      <button class="tab" data-tab="hof">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l-2.5 2 4.5 4.5L12 21l4-5.5L20.5 11 18 9l-3 3H9z"/><path d="M8 4h8l-1.5 5h-5z"/></svg>
        Подиум
      </button>
      <button class="tab" data-tab="dealers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16l-1.5 6.5a2 2 0 0 1-2 1.5h-9a2 2 0 0 1-2-1.5z"/><path d="M7 13c-.5-1.5-1.8-4-2-6.5A3 3 0 0 1 8 4h8a3 3 0 0 1 3 2.5c-.2 2.5-1.5 5-2 6.5"/></svg>
        Ведущие
      </button>
    </div>
  </nav>
</div>

<script>
  var API = "https://script.google.com/macros/s/AKfycbwXrgT_FBDueyA4ap3gryOQQfxBqiv2GJL_H4Ejt3bQhOdZThoMW_j61T-C7Oq4ZTTseg/exec";

  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function getJson(type, extra, onOk, onErr) {
    fetch(API + "?type=" + type + (extra || ""))
      .then(function (r) { return r.json(); })
      .then(function (p) {
        if (p && p.success) onOk(p.data);
        else throw ((p && p.error) || "ошибка сервера");
      })
      .catch(function (err) { onErr(err); });
  }

  /* ---------- Client-side cache (ускорение вкладок) ---------- */
  var dataCache = {};
  var dataCacheTs = {};
  var TTL = { lb: 30000, player: 300000, hof: 300000, dealers: 300000 };
  function getCached(key) {
    var c = dataCache[key];
    if (c !== undefined) {
      var cat = key.indexOf("-") > -1 ? key.split("-")[0] : key;
      if (Date.now() - (dataCacheTs[key] || 0) < (TTL[cat] || 60000)) return c;
    }
    return null;
  }
  function setCached(key, val) { dataCache[key] = val; dataCacheTs[key] = Date.now(); }

  /* ---------- Icons ---------- */
  var I = {
    game: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5C2 6 4 4 6.5 4h11C20 4 22 6 22 8.5v7c0 2.5-2 4.5-4.5 4.5h-11C4 20 2 18 2 15.5z"/><path d="M2 9h20"/><path d="M7 13h.01M11 13h.01M7 16h.01"/></svg>',
    ko: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v3M12 17.2v3M3.8 12h3M17.2 12h3" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6"/></svg>',
    rank: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.5 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>',
    stack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="14" r="6.5"/><circle cx="12" cy="14" r="2.6"/><path d="M8.5 7a5.5 5.5 0 0 1 7 0" stroke-linecap="round"/></svg>',
    set: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3c-4.5 5-7.5 8-7.5 11a4 4 0 0 0 6.5 3V21h2v-4a4 4 0 0 0 6.5-3C19.5 11 16.5 8 12 3z"/><circle cx="5.5" cy="17" r="1.8"/><circle cx="18.5" cy="17" r="1.8"/></svg>',
    double: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>',
    trendUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6 4 4 6-7"/><path d="M15 8h5v5"/></svg>',
    trendDown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l6 6 4-4 6 7"/><path d="M15 16h5v-5"/></svg>',
    trendSame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h16M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>',
    trendNew: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 4.6 4.9.4-3.7 3.2 1.1 4.8L12 12.5 7.9 15l1.1-4.8L5.3 7l4.9-.4z"/></svg>'
  };

  var ACHV = {
    "🎮": { label: "Очки игры", color: "#3f72c4", icon: I.game },
    "🎯": { label: "Нокауты", color: "#d34a42", icon: I.ko },
    "🏷️": { label: "Ранг", color: "#e0a92e", icon: I.rank },
    "💎": { label: "Stack", color: "#7c50b8", icon: I.stack },
    "♠": { label: "Set", color: "#1f9d5c", icon: I.set },
    "⚡": { label: "Double", color: "#e0862e", icon: I.double }
  };

  /* ---------- Utils ---------- */
  var MONTHS = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  var WDAYS = ["вс","пн","вт","ср","чт","пт","сб"];

  function formatDate(ds) {
    var d = new Date(ds + "T00:00:00");
    if (isNaN(d.getTime())) return ds || "";
    return d.getDate() + " " + MONTHS[d.getMonth()];
  }

  function weekdayOf(ds) {
    var d = new Date(ds + "T00:00:00");
    if (isNaN(d.getTime())) return "";
    return WDAYS[d.getDay()];
  }

  var MONTHS_NOM = ["", "январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];

  function monthLabel(m) {
    var p = String(m || "").split("-");
    if (p.length === 2 && Number(p[1]) >= 1 && Number(p[1]) <= 12) {
      return MONTHS_NOM[Number(p[1])] + " " + p[0];
    }
    return m || "этот месяц";
  }

  function parseTrend(t) {
    t = t || "🆕";
    if (t.indexOf("🔼") > -1) return { dir: "up", val: (t.match(/\d+/) || [""])[0] };
    if (t.indexOf("🔽") > -1) return { dir: "down", val: (t.match(/\d+/) || [""])[0] };
    if (t.indexOf("➖") > -1 || t.indexOf("—") > -1) return { dir: "same", val: "" };
    return { dir: "new", val: "" };
  }

  function rankOf(str) {
    str = str || "";
    if (str.indexOf("BOSS") > -1) return { cls: "r-boss", label: "BOSS", sub: (str.match(/\d+\/\d+/) || [""])[0] };
    if (str.indexOf("LEGEND") > -1) return { cls: "r-legend", label: "LEGEND", sub: (str.match(/\d+\/\d+/) || [""])[0] };
    if (str.indexOf("SHARK") > -1) return { cls: "r-shark", label: "SHARK", sub: (str.match(/\d+\/\d+/) || [""])[0] };
    if (str.indexOf("FISH") > -1) return { cls: "r-fish", label: "FISH", sub: (str.match(/\d+\/\d+/) || [""])[0] };
    return { cls: "", label: "—", sub: "" };
  }

  function cleanAchvValue(txt) {
    return txt.replace(/\s*\((Нокауты|Ранг|Stack|Set|Double)\)\s*$/i, "").trim();
  }

  function renderBreakdown(str) {
    if (!str || str === "0 очков") return '<div class="achv-empty">Бонусов пока нет</div>';
    var parts = String(str).split("|");
    var html = [];
    for (var i = 0; i < parts.length; i++) {
      var raw = parts[i].trim();
      if (!raw) continue;
      var icon = null, meta = null, body = raw;
      for (var k in ACHV) {
        if (raw.indexOf(k) === 0) {
          meta = ACHV[k];
          icon = meta.icon;
          body = raw.substring(k.length).trim();
          break;
        }
      }
      if (!meta) continue;
      html.push('<div class="achv">'
        + '<span class="achv-ic" style="background:rgba(' + hexToRgb(meta.color) + ',.16);color:' + meta.color + '">' + icon + '</span>'
        + '<span><span class="achv-l" style="display:block">' + esc(meta.label) + '</span>'
        + '<span class="achv-v" style="display:block">' + esc(cleanAchvValue(body)) + '</span></span>'
        + '</div>');
    }
    return html.length ? '<div class="achv-grid">' + html.join("") + '</div>' : '<div class="achv-empty">Бонусов пока нет</div>';
  }

  function hexToRgb(hex) {
    var n = parseInt(hex.replace("#", ""), 16);
    return (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255);
  }

  /* ---------- Tabs / navigation ---------- */
  var LB = [], CUR = "current";

  function showPanel(name) {
    document.querySelectorAll(".panel").forEach(function (p) { p.classList.remove("active"); });
    document.getElementById("panel-" + name).classList.add("active");
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("on", t.getAttribute("data-tab") === name);
    });
  }

  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () { goTo(this.getAttribute("data-tab")); });
  });

  function goTo(name) {
    if (name === "lb") { showPanel("lb"); loadLeaderboard(); }
    else if (name === "hof") { showPanel("hof"); loadHof(); }
    else if (name === "dealers") { showPanel("dealers"); loadDealers(); }
  }

  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".seg button").forEach(function (x) { x.classList.remove("on"); x.setAttribute("aria-selected", "false"); });
      this.classList.add("on"); this.setAttribute("aria-selected", "true");
      CUR = this.getAttribute("data-per");
      loadLeaderboard();
    });
  });

  var searchEl = document.getElementById("lb-search");
  searchEl.addEventListener("input", function () { renderLb(LB); });

  /* ---------- Leaderboard ---------- */
  function skeletons(n) {
    var h = "";
    for (var i = 0; i < (n || 6); i++) h += '<div class="sk sk-row"></div>';
    return '<div>' + h + '</div>';
  }

  function loadLeaderboard() {
    showPanel("lb");
    var isAll = CUR === "all";
    var key = isAll ? "lb-all" : "lb-cur";
    document.getElementById("lb-title").textContent = isAll ? "Рейтинг · всё время" : "Лидерборд";
    document.getElementById("lb-sub").textContent = isAll
      ? "Всё время · базовые очки"
      : "Месяц · по очкам с ачивками";

    var cached = getCached(key);
    if (cached) {
      LB = cached;
      renderLb(LB);
      if (Date.now() - (dataCacheTs[key] || 0) > 10000) fetchLb(key, isAll, true);
      return;
    }
    document.getElementById("lb-list").innerHTML = skeletons(7);
    document.getElementById("lb-state").innerHTML = "";
    fetchLb(key, isAll, false);
  }

  function fetchLb(key, isAll, isRefresh) {
    getJson(isAll ? "leaderboard" : "current", "", function (data) {
      // Ответ мог прийти после переключения периода/вкладки — игнорируем устаревший,
      // чтобы не перетереть актуальные данные пустым/чужим списком.
      if ((CUR === "all") !== isAll) return;
      LB = data || [];
      setCached(key, LB);
      document.getElementById("lb-state").innerHTML = "";
      renderLb(LB);
    }, function (err) {
      if (!isRefresh) {
        document.getElementById("lb-list").innerHTML = "";
        document.getElementById("lb-state").innerHTML = stateHtml("Ошибка загрузки", "Не удалось получить данные. Проверьте сеть.", true);
      }
    });
  }

  function failLb() {}

  function stateHtml(title, text, retry) {
    return '<div class="state">'
      + '<svg class="emblem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v6M12 16h.01" stroke-linecap="round"/></svg>'
      + '<h3>' + esc(title) + '</h3>'
      + '<p>' + esc(text) + '</p>'
      + (retry ? '<button class="btn btn--gold" onclick="location.reload()">Повторить</button>' : '')
      + '</div>';
  }

  function renderLb(rows) {
    var isAll = CUR === "all";
    var q = (searchEl.value || "").trim().toLowerCase();
    var html = "";
    var count = 0;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var name, rankText, trend;
      if (isAll) {
        name = r.player || r.realName || "";
        rankText = '<span style="color:var(--muted)">' + esc(r.games || 0) + ' игр · ITM ' + esc(r.itm || 0) + '</span>';
        trend = { dir: "same", val: "" };
      } else {
        name = String(r[2] || "");
        var rank = rankOf(r[4]);
        rankText = '<span class="rank-chip ' + rank.cls + '"></span><span>' + esc(rank.label) + (rank.sub ? " " + esc(rank.sub) : "") + '</span>';
        trend = parseTrend(r[1]);
      }
      if (!name || (q && name.toLowerCase().indexOf(q) === -1)) continue;
      count++;
      html += lbRow(i, name, isAll ? (Number(r.totalPoints) || 0) : (Number(r[3]) || 0), rankText, trend);
    }
    document.getElementById("lb-list").innerHTML = html || (q
      ? stateHtml("Никого нет", "По запросу «" + esc(q) + "» игроки не найдены.", false)
      : stateHtml("Пока пусто", "За этот период игр ещё не было.", false));
  }

  function lbRow(i, name, points, rankText, trend) {
    var pos = i + 1;
    var pCls = pos === 1 ? "p1" : (pos === 2 ? "p2" : (pos === 3 ? "p3" : ""));
    var trendIcon = I.trendSame;
    if (trend.dir === "up") trendIcon = I.trendUp;
    else if (trend.dir === "down") trendIcon = I.trendDown;
    else if (trend.dir === "new") trendIcon = I.trendNew;
    var trendTxt = trend.val ? (trend.dir === "down" ? "-" + trend.val : "+" + trend.val) : "";
    return '<div class="lb-row" onclick="openPlayer(' + i + ')">'
      + '<div class="lb-pos ' + pCls + '">' + pos + '</div>'
      + '<div class="lb-main">'
      +   '<div class="lb-name">' + esc(name) + '</div>'
      +   '<div class="lb-meta">' + rankText + '</div>'
      + '</div>'
      + '<div class="lb-right">'
      +   '<div class="pts-chip' + (pos === 1 ? " lead" : "") + '">' + points + '</div>'
      +   '<div class="trend ' + trend.dir + '">' + trendIcon + trendTxt + '</div>'
      + '</div>'
      + '</div>';
  }

  /* ---------- Player card ---------- */
  function openPlayer(idx) {
    if (!LB[idx]) return;
    var r = LB[idx];
    var name = r[2] !== undefined ? r[2] : (r.player || r.realName || "");
    showPanel("player");
    var key = "player-" + name;
    var cached = getCached(key);
    document.getElementById("pl-content").innerHTML = cached ? "" : '<div>' + skeletons(4) + '</div>';
    getJson("player", "&name=" + encodeURIComponent(name), function (c) {
      if (!c) {
        if (!cached) document.getElementById("pl-content").innerHTML = stateHtml("Игрок не найден", "Попробуйте другого игрока из рейтинга.", false);
        return;
      }
      setCached(key, c);
      renderPlayer(c);
    }, function (err) {
      if (!cached) document.getElementById("pl-content").innerHTML = stateHtml("Ошибка", "Не удалось загрузить карточку.", true);
    });
    if (cached) renderPlayer(cached);
    document.getElementById("view").scrollTop = 0;
  }

  function goBackToLb() { loadLeaderboard(); }

  function medalChip(n) {
    var cls = n === 1 ? "pl1" : (n === 2 ? "pl2" : (n === 3 ? "pl3" : (n === 4 ? "pl4" : "pl5")));
    return '<span class="hof-place ' + cls + '">' + n + '</span>';
  }

  function fmtTag(f) {
    f = (f || "").toLowerCase();
    if (f.indexOf("mtt") > -1) return '<span class="fmt-chip mtt">MTT</span>';
    if (f.indexOf("mystery") > -1 || f.indexOf("bounty") > -1) return '<span class="fmt-chip mb">MYSTERY</span>';
    return '<span class="fmt-chip sng">SNG</span>';
  }

  function evLabel(ev) {
    return ev === "Нокаут" ? "Выбивание" : (ev || "—");
  }

  function renderPlayer(c) {
    var h = '';
    h += '<div class="p-head"><div class="p-name">' + esc(c.name) + '</div></div>';

    h += '<div class="block"><h3>Текущий месяц</h3>';
    if (c.month) {
      var rank = rankOf(c.month.rank);
      var trend = parseTrend(c.month.trend);
      var ti = I.trendSame;
      if (trend.dir === "up") ti = I.trendUp; else if (trend.dir === "down") ti = I.trendDown; else if (trend.dir === "new") ti = I.trendNew;
      h += '<div class="p-hero">'
        + '<div class="p-pos"><small>#</small>' + (Number(c.month.position) || "—") + '</div>'
        + '<div class="p-hero-meta">'
        +   '<span class="p-rank"><span class="rank-chip ' + rank.cls + '"></span>' + esc(rank.label) + (rank.sub ? " " + esc(rank.sub) : "") + '</span>'
        +   '<span class="trend ' + trend.dir + '" style="font-size:12.5px">' + ti + (trend.val ? " " + (trend.dir === "down" ? "-" : "+") + trend.val : "") + '</span>'
        + '</div>'
        + '</div>';
      h += renderBreakdown(c.month.breakdown);
    } else {
      h += '<p class="state" style="padding:12px">Нет игр за месяц</p>';
    }
    h += '</div>';

    h += '<div class="block"><h3>За всё время</h3>';
    if (c.allTime) {
      var at = c.allTime;
      if (at.position) {
        h += '<div class="p-hero p-hero--alltime">'
          + '<div class="p-pos"><small>#</small>' + at.position + '</div>'
          + '<div class="p-hero-meta"><span class="p-rank-label">место за всё время</span></div>'
          + '</div>';
      }
      h += '<div class="grid">'
        + '<div class="tile gold"><div class="tl">Очки</div><div class="tv">' + at.totalPoints + '</div></div>'
        + '<div class="tile"><div class="tl">ITM</div><div class="tv">' + at.itm + '</div></div>'
        + '<div class="tile"><div class="tl">Нокауты</div><div class="tv">' + at.knockouts + '</div></div>'
        + '<div class="tile"><div class="tl">Очки игры</div><div class="tv">' + at.gamePoints + '</div></div>'
        + '<div class="tile"><div class="tl">Очки KO</div><div class="tv">' + at.koPoints + '</div></div>'
        + (at.mttPlacePoints > 0 ? '<div class="tile"><div class="tl">MTT призовые</div><div class="tv">' + at.mttPlacePoints + '</div></div>' : '')
        + '</div>';

      var maxPlace = Math.max(1, at.place1, at.place2, at.place3);
      var pls = [{ n: 1, v: at.place1, c: "#d8a83a" }, { n: 2, v: at.place2, c: "#b9bfc9" }, { n: 3, v: at.place3, c: "#bd7c3c" }];
      h += '<div class="bars">';
      for (var b = 0; b < pls.length; b++) {
        var hgt = Math.round((pls[b].v / maxPlace) * 100);
        h += '<div class="bar"><div class="bv">' + pls[b].v + '</div><div class="b" style="height:' + hgt + '%;background:' + pls[b].c + '"></div><div class="bl">' + pls[b].n + '</div></div>';
      }
      h += '</div>';
    } else {
      h += '<p class="state" style="padding:12px">Нет данных</p>';
    }
    h += '</div>';

    if (c.mtt) {
      var mt = c.mtt;
      var mttMax = Math.max(1, mt.places[1] || 0, mt.places[2] || 0, mt.places[3] || 0, mt.places[4] || 0, mt.places[5] || 0);
      var mttCols = { 1: "#d8a83a", 2: "#b9bfc9", 3: "#bd7c3c", 4: "#4b82d8", 5: "#aab6c4" };
      h += '<div class="block block--mtt"><h3>MTT-подиум <span class="n">' + (mt.podiumCount || 0) + '</span></h3>';
      h += '<div class="bars">';
      for (var m = 1; m <= 5; m++) {
        var mv = mt.places[m] || 0;
        var mh = Math.round((mv / mttMax) * 100);
        h += '<div class="bar"><div class="bv">' + mv + '</div><div class="b" style="height:' + mh + '%;background:' + mttCols[m] + '"></div><div class="bl">' + m + '</div></div>';
      }
      h += '</div>';
      h += '<div class="heat-note" style="margin-top:10px">Места 1–5 в MTT</div>';
      h += '</div>';
    }

    h += '<div class="block"><h3>История игр <span class="n">' + (c.history || []).length + '</span></h3>';
    if (c.history && c.history.length) {
      for (var i = 0; i < c.history.length; i++) {
        var g = c.history[i];
        h += '<div class="arch-row">'
          + '<div class="arch-d">' + esc(formatDate(g.date)) + '</div>'
          + '<div><div class="arch-ev">' + esc(evLabel(g.event)) + fmtTag(g.format) + '</div>'
          + '<div class="arch-fmt">' + esc(g.format) + ' · ' + esc(g.dealer || "—") + '</div></div>'
          + '<div class="arch-pts">' + (g.points ? "+" + g.points : "—") + '</div>'
          + '</div>';
      }
    } else {
      h += '<p class="state" style="padding:12px">Игр пока нет</p>';
    }
    h += '</div>';

    document.getElementById("pl-content").innerHTML = h;
  }

  /* ---------- Podium (Hall of Fame) ---------- */
  function loadHof() {
    showPanel("hof");
    var cached = getCached("hof");
    if (cached) {
      document.getElementById("hof-state").innerHTML = "";
      renderHof(cached);
      if (Date.now() - (dataCacheTs["hof"] || 0) > 10000) fetchHof(true);
      return;
    }
    document.getElementById("hof-list").innerHTML = '<div>' + skeletons(6) + '</div>';
    document.getElementById("hof-state").innerHTML = "";
    fetchHof(false);
  }

  function fetchHof(isRefresh) {
    getJson("halloffame", "", function (data) {
      setCached("hof", data || []);
      document.getElementById("hof-state").innerHTML = "";
      renderHof(data || []);
    }, function (err) {
      if (!isRefresh) {
        document.getElementById("hof-list").innerHTML = "";
        document.getElementById("hof-state").innerHTML = stateHtml("Ошибка загрузки", "Не удалось получить подиум.", true);
      }
    });
  }

  function renderHof(list) {
    if (!list.length) {
      document.getElementById("hof-list").innerHTML = stateHtml("Пока пусто", "Призовых мест в MTT ещё не было.", false);
      return;
    }
    var days = [];
    var order = [];
    list.forEach(function (it) {
      var d = it.date || "";
      if (order.indexOf(d) === -1) order.push(d);
    });
    var html = "";
    order.forEach(function (d) {
      var rows = list.filter(function (it) { return (it.date || "") === d; });

      var dealers = {};
      rows.forEach(function (it) { if (it.dealer) dealers[String(it.dealer).trim()] = true; });
      var dealerNames = Object.keys(dealers);
      var dealerLine = dealerNames.length === 1
        ? ' <span class="day-dealer">· ведущий ' + esc(dealerNames[0]) + '</span>'
        : "";

      html += '<div class="day-head">' + esc(formatDate(d)) + dealerLine + '</div>';

      var pod = [];
      for (var p = 1; p <= 3; p++) {
        for (var r = 0; r < rows.length; r++) {
          if (Number(rows[r].place) === p) { pod[p] = rows[r]; break; }
        }
      }
      var hasPod = pod[1] || pod[2] || pod[3];
      if (hasPod) {
        html += '<div class="podium">';
        for (var q = 1; q <= 3; q++) {
          if (pod[q]) {
            var cls = q === 1 ? "gold" : (q === 2 ? "silver" : "bronze");
            var hgt = q === 1 ? 108 : (q === 2 ? 82 : 62);
            html += '<div class="pod ' + cls + '"><div class="pn">' + esc(pod[q].player) + '</div><div class="pb" style="height:' + hgt + 'px">' + q + '</div></div>';
          } else {
            html += '<div class="pod other"><div class="pn" style="color:var(--muted-2)">—</div><div class="pb" style="height:30px">·</div></div>';
          }
        }
        html += '</div>';
      }

      for (var i = 0; i < rows.length; i++) {
        var it = rows[i];
        html += '<div class="hof-row">'
          + medalChip(Number(it.place) || 1)
          + '<div><div class="hof-name">' + esc(it.player) + '</div>'
          + '<div class="hof-sub">' + esc(it.format) + ' · ' + esc(it.points) + ' очков</div></div>'
          + '</div>';
      }
    });
    document.getElementById("hof-list").innerHTML = html;
  }

  /* ---------- Dealers ---------- */
  function loadDealers() {
    showPanel("dealers");
    var cached = getCached("dealers");
    if (cached) {
      document.getElementById("de-state").innerHTML = "";
      renderDealers(cached);
      if (Date.now() - (dataCacheTs["dealers"] || 0) > 10000) fetchDealers(true);
      return;
    }
    document.getElementById("de-content").innerHTML = '<div>' + skeletons(4) + '</div>';
    document.getElementById("de-state").innerHTML = "";
    fetchDealers(false);
  }

  function fetchDealers(isRefresh) {
    getJson("dealers", "", function (data) {
      var obj = data || { dealers: [], dates: [], matrix: [], byMonth: [], month: "" };
      setCached("dealers", obj);
      document.getElementById("de-state").innerHTML = "";
      renderDealers(obj);
    }, function (err) {
      if (!isRefresh) {
        document.getElementById("de-content").innerHTML = "";
        document.getElementById("de-state").innerHTML = stateHtml("Ошибка загрузки", "Не удалось получить данные ведущих.", true);
      }
    });
  }

  function renderDealers(d) {
    document.getElementById("de-sub").textContent = "Игры ведущих за " + monthLabel(d.month);
    var h = '';

    h += '<div class="block"><h3>Игр за месяц</h3>';
    var sorted = (d.byMonth || []).slice().sort(function (a, b) { return b.games - a.games; });
    if (!sorted.length) {
      h += '<p class="state" style="padding:12px">Игр за месяц пока не было</p>';
    } else {
      for (var i = 0; i < sorted.length; i++) {
        var x = sorted[i];
        var isLead = i === 0 && x.games > 0;
        h += '<div class="dealer-total"><span class="d-rank' + (isLead ? " lead" : "") + '">' + (i + 1) + '</span>'
          + '<span class="d-name' + (isLead ? " lead" : "") + '">' + esc(x.dealer) + '</span>'
          + '<b>' + x.games + ' игр</b></div>';
      }
    }
    h += '</div>';

    var dealers = d.dealers || [], dates = d.dates || [], matrix = d.matrix || [];
    if (dealers.length && dates.length) {
      h += '<div class="block"><h3>Игры по дням</h3>';
      var max = 1;
      matrix.forEach(function (row) { row.forEach(function (v) { if (v > max) max = v; }); });
      function heatColor(v) {
        if (!v) return "rgba(255,255,255,.05)";
        var t = v / max;
        if (t < 0.34) return "rgba(224,169,46,.32)";
        if (t < 0.67) return "rgba(224,169,46,.62)";
        return "#e0a92e";
      }
      h += '<div class="heat-wrap"><div class="heat">';
      h += '<div class="heat-row"><div class="heat-hd"></div>';
      for (var dc = 0; dc < dates.length; dc++) {
        h += '<div class="heat-dh"><span class="d">' + esc(String(dates[dc]).slice(8)) + '</span><span class="w">' + esc(weekdayOf(dates[dc])) + '</span></div>';
      }
      h += '</div>';
      for (var di = 0; di < dealers.length; di++) {
        h += '<div class="heat-row"><div class="heat-hd' + (di === 0 ? " lead" : "") + '">' + esc(dealers[di]) + '</div>';
        for (var c = 0; c < dates.length; c++) {
          var v = (matrix[di] && matrix[di][c]) || 0;
          h += '<div class="heat-cell' + (v ? "" : " zero") + '" style="background:' + heatColor(v) + '">' + (v || "") + '</div>';
        }
        h += '</div>';
      }
      h += '</div></div>';
      h += '<div class="heat-note">Номер — день месяца, под ним день недели. Цифра — количество игр за день.</div>';
      h += '</div>';
    }

    document.getElementById("de-content").innerHTML = h;
  }

  /* ---------- Boot ---------- */
  // Service Worker: кэширует HTML, шрифт и данные API — повторные открытия
  // Mini App происходят мгновенно, даже без сети.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  try {
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      Telegram.WebApp.setHeaderColor("#0b1830");
      Telegram.WebApp.setBackgroundColor("#0b1830");
    }
  } catch (e) {}

  // Один запрос bundle при старте: кэшируем все вкладки сразу,
  // чтобы переключение между ними было мгновенным.
  // Дополнительно сохраняем bundle в localStorage — при повторном открытии
  // Mini App рендерится мгновенно, а свежие данные подгружаются фоном.
  var LS_KEY = "atmos_bundle_v2";
  var LS_TTL = 300000; // 5 минут

  function applyBundle(b) {
    if (!b) return;
    if (b.current) setCached("lb-cur", b.current);
    if (b.all) setCached("lb-all", b.all);
    if (b.hof) setCached("hof", b.hof);
    if (b.dealers) setCached("dealers", b.dealers);
  }

  function fetchBundle(onDone) {
    getJson("bundle", "", function (b) {
      if (b) {
        applyBundle(b);
        try {
          localStorage.setItem(LS_KEY, JSON.stringify({ ts: Date.now(), bundle: b }));
        } catch (e) {}
      }
      if (onDone) onDone();
    }, function () {
      if (onDone) onDone();
    });
  }

  function loadBundle(onDone) {
    var saved = null;
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var obj = JSON.parse(raw);
        if (obj && obj.bundle && obj.ts && Date.now() - obj.ts < LS_TTL) saved = obj.bundle;
      }
    } catch (e) {}

    if (saved) {
      applyBundle(saved);
      if (onDone) onDone();
      fetchBundle(onDone); // фоновая актуализация
      return;
    }
    document.getElementById("lb-list").innerHTML = skeletons(7);
    fetchBundle(onDone);
  }

  loadBundle(function () { loadLeaderboard(); });
</script>
</body>
</html>
